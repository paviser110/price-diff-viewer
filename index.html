<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upbit ↔ Bithumb 호가 갭</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8a93a5;
    --up: #f6465d;    /* 한국 관례: 빨강 = 상승/플러스 */
    --down: #2f7cf6;  /* 파랑 = 하락/마이너스 */
    --accent: #f0b90b;
    --good: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 1300px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 700; }
  .status-bar { display: flex; gap: 8px; margin: 12px 0 16px; flex-wrap: wrap; align-items: center; }
  .pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
  .pill.ok .dot { background: var(--good); }
  .pill.err .dot { background: var(--up); }
  .pill.wait .dot { background: var(--accent); }
  .size-ctl { color: var(--text); }
  .size-ctl input {
    width: 64px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 6px; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums;
  }
  #updated { margin-left: auto; font-size: 12px; color: var(--muted); }
  /* 열 폭 고정: 값 길이가 바뀌어도 레이아웃이 흔들리지 않게 */
  table {
    width: 100%; min-width: 1248px; table-layout: fixed; border-collapse: collapse;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; font-variant-numeric: tabular-nums;
  }
  thead th {
    font-size: 12px; font-weight: 600; color: var(--muted); text-align: right;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: bottom;
  }
  thead th.tok { text-align: left; }
  thead th.grp { text-align: center; color: var(--text); border-bottom: none; padding-bottom: 2px; }
  thead th.grp-l { border-left: 1px solid var(--border); }
  tbody td {
    padding: 9px 10px; text-align: right; font-size: 14px;
    border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child { text-align: left; font-weight: 700; }
  /* 그룹 경계 (빗썸 / 업비트 / 빗썸→업비트 / 업비트→빗썸) */
  tbody td:nth-child(2), tbody td:nth-child(4), tbody td:nth-child(6), tbody td:nth-child(11) { border-left: 1px solid var(--border); }
  .pos { color: var(--up); }
  .neg { color: var(--down); }
  .none { color: var(--muted); }
  .stale { color: var(--muted); opacity: .55; }
  td.gap { font-weight: 700; cursor: help; }
  td.sub { font-size: 13px; cursor: help; }
  td.sub.dim { opacity: .55; }
  td.sig-good { background: rgba(46,204,113,.09); }
  .bad-text { color: var(--up); }
  td.profit { font-weight: 700; }
  .hdot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #555;
    margin-right: 6px; vertical-align: middle; position: relative; top: -1px;
  }
  .hdot.good { background: var(--good); }
  .hdot.warn { background: var(--accent); }
  .hdot.bad  { background: var(--up); }
  @keyframes flashUp   { 0% { background: rgba(246,70,93,.18); } 100% { background: transparent; } }
  @keyframes flashDown { 0% { background: rgba(47,124,246,.18); } 100% { background: transparent; } }
  td.flash-up   { animation: flashUp .6s ease-out; }
  td.flash-down { animation: flashDown .6s ease-out; }
  .table-scroll { overflow-x: auto; }
  footer { margin-top: 10px; font-size: 11px; color: var(--muted); opacity: .6; text-align: right; }
  #error-box {
    display: none; margin: 12px 0; padding: 10px 14px; font-size: 13px;
    border: 1px solid var(--up); border-radius: 8px; color: var(--up); background: rgba(246,70,93,.06);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Upbit ↔ Bithumb 호가 갭</h1>
  </header>

  <div class="status-bar">
    <span class="pill wait" id="st-upbit"><span class="dot"></span>Upbit</span>
    <span class="pill wait" id="st-bithumb"><span class="dot"></span>Bithumb</span>
    <label class="pill size-ctl" title="업비트에서 시장가로 체결할 금액. 이 금액 기준으로 잔량/슬리피지를 계산합니다.">체결 규모 <input id="take-size" type="number" min="1" step="10" inputmode="numeric"> 만원</label>
    <label class="pill size-ctl" title="양쪽 수수료 합(bp). 슬리피지 차감 실효 갭이 이 값 이상이면 초록.">수수료 <input id="fee-bp" type="number" min="0" step="1" inputmode="numeric"> bp</label>
    <span id="updated"></span>
  </div>

  <div id="error-box"></div>

  <div class="table-scroll">
    <table>
      <colgroup>
        <col style="width:72px">
        <col style="width:98px"><col style="width:98px">
        <col style="width:98px"><col style="width:98px">
        <col style="width:88px"><col style="width:68px"><col style="width:72px"><col style="width:80px"><col style="width:84px">
        <col style="width:88px"><col style="width:68px"><col style="width:72px"><col style="width:80px"><col style="width:84px">
      </colgroup>
      <thead>
        <tr>
          <th class="tok" rowspan="2">토큰</th>
          <th class="grp grp-l" colspan="2">빗썸</th>
          <th class="grp grp-l" colspan="2">업비트</th>
          <th class="grp grp-l" colspan="5">빗썸 → 업비트</th>
          <th class="grp grp-l" colspan="5">업비트 → 빗썸</th>
        </tr>
        <tr>
          <th class="grp-l">bid</th><th>ask</th>
          <th class="grp-l">bid</th><th>ask</th>
          <th class="grp-l">갭</th><th>슬립</th><th>잔량</th><th>최대</th><th>수익</th>
          <th class="grp-l">갭</th><th>슬립</th><th>잔량</th><th>최대</th><th>수익</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer><span id="app-ver"></span></footer>
</div>

<script>
'use strict';

const APP_VERSION = '17';
const UPBIT_DIRECT_REST = 'https://api.upbit.com/v1';

const EXCHANGES = {
  // 업비트는 브라우저 Origin별 rate limit이 빡빡해서 폴링을 더 느리게 (한도에 걸리면 요청을 멈춰야 풀림)
  upbit:   { ws: 'wss://api.upbit.com/websocket/v1',      rest: UPBIT_DIRECT_REST,             el: 'st-upbit',   pollMs: 5000 },
  bithumb: { ws: 'wss://ws-api.bithumb.com/websocket/v1', rest: 'https://api.bithumb.com/v1', el: 'st-bithumb', pollMs: 3000 },
};

const TOKENS_POLL_MS = 3000;
const DEFAULT_TAKE_MAN = 100;    // 업비트 체결 규모 기본값 (만원)
const DEFAULT_FEE_BP = 10;       // 양쪽 수수료 합 기본값 (bp) — 빗썸 5bp + 업비트 5bp
const MAX_LEVELS_GOOD = 2;       // 초록은 다음 호가(2호가)까지로 전량 체결될 때만

// books[symbol] = { upbit: Book|null, bithumb: Book|null }
// Book = { bid, ask, bids: [[price, size], ...] (높은 가격순), asks: [[price, size], ...] (낮은 가격순), t }
const books = {};
let symbols = [];
let takeSizeKrw = DEFAULT_TAKE_MAN * 10000;
let feeBp = DEFAULT_FEE_BP;
const feePct = () => feeBp / 100;
const conns = { upbit: null, bithumb: null };  // 거래소별 연결 핸들
const marketCache = { upbit: null, bithumb: null }; // market/all 결과 캐시 (Set)
const shown = {}; // 가격 셀별 마지막 표시 값 (변동 방향 플래시용)

const $ = (id) => document.getElementById(id);

function showError(msg) {
  const box = $('error-box');
  box.style.display = 'block';
  box.textContent = msg;
}
function hideError() { $('error-box').style.display = 'none'; }

function setStatus(ex, state, label) {
  const el = $(EXCHANGES[ex].el);
  el.className = 'pill ' + state;
  el.innerHTML = '<span class="dot"></span>' + label;
}

function priceDigits(v) {
  if (v < 1) return 4;
  if (v < 100) return 2;
  if (v < 1000) return 1;
  return 0;
}
function fmtPrice(v, extra) {
  if (v == null) return '−';
  const d = priceDigits(v) + (extra || 0);
  return v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtPct(p) { return (p > 0 ? '+' : (p < 0 ? '−' : '')) + Math.abs(p).toFixed(3) + '%'; }
function pctCls(p) { return p > 0 ? 'pos' : (p < 0 ? 'neg' : ''); }
// 원화 금액을 만/억 단위로 짧게
function fmtKrwShort(v) {
  if (v >= 1e8) return (v / 1e8).toFixed(v >= 1e9 ? 0 : 1) + '억';
  if (v >= 1e5) return Math.round(v / 1e4).toLocaleString('ko-KR') + '만';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + '만';
  return Math.round(v).toLocaleString('ko-KR');
}

// ---------- 업비트 체결 규모 입력 ----------
function initTakeSize() {
  try {
    const v = Number(localStorage.getItem('takeSizeMan'));
    if (v > 0) takeSizeKrw = v * 10000;
  } catch {}
  const inp = $('take-size');
  inp.value = Math.round(takeSizeKrw / 10000);
  inp.addEventListener('change', () => {
    const v = Number(inp.value);
    if (!(v > 0)) { inp.value = Math.round(takeSizeKrw / 10000); return; }
    takeSizeKrw = v * 10000;
    try { localStorage.setItem('takeSizeMan', String(v)); } catch {}
    for (const s of symbols) markDirty(s);
  });

  try {
    const p = localStorage.getItem('feeBp');
    if (p !== null && Number(p) >= 0) feeBp = Number(p);
  } catch {}
  const fin = $('fee-bp');
  fin.value = feeBp;
  fin.addEventListener('change', () => {
    const v = Number(fin.value);
    if (!(v >= 0)) { fin.value = feeBp; return; }
    feeBp = v;
    try { localStorage.setItem('feeBp', String(v)); } catch {}
    for (const s of symbols) markDirty(s);
  });
}

// ---------- tokens.md 파싱 ----------
async function loadTokens() {
  const res = await fetch('./tokens.md', { cache: 'no-store' });
  if (!res.ok) throw new Error('tokens.md 로드 실패 (' + res.status + ')');
  const text = await res.text();
  const out = [];
  for (const raw of text.split('\n')) {
    let line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith('<!--')) continue;
    line = line.replace(/^[-*+]\s*/, '').replace(/[`\[\]()]/g, '').trim();
    const word = line.split(/\s+/)[0];
    if (/^[A-Za-z0-9]{1,10}$/.test(word)) {
      const sym = word.toUpperCase();
      if (!out.includes(sym)) out.push(sym);
    }
  }
  return out;
}

// ---------- 호가 파싱 / 테이킹 시뮬레이션 ----------
// Upbit/Bithumb 공통 orderbook_units → Book. 최우선 호가가 앞에 오도록 정렬.
function parseBook(units) {
  const bids = [], asks = [];
  for (const u of units) {
    if (u.bid_price > 0 && u.bid_size > 0) bids.push([u.bid_price, u.bid_size]);
    if (u.ask_price > 0 && u.ask_size > 0) asks.push([u.ask_price, u.ask_size]);
  }
  if (!bids.length || !asks.length) return null;
  bids.sort((a, b) => b[0] - a[0]);
  asks.sort((a, b) => a[0] - b[0]);
  return { bid: bids[0][0], ask: asks[0][0], bids, asks, t: Date.now() };
}

// levels: [[price, size], ...] 유리한 가격순. notional(KRW)만큼 시장가로 먹었을 때의 체결 시뮬레이션.
function simulateTake(levels, notional) {
  if (!levels.length) return null;
  let remain = notional, cost = 0, qty = 0, used = 0, depth = 0;
  for (const [p, s] of levels) {
    const lvl = p * s;
    depth += lvl;
    if (remain > 0) {
      used++;
      if (lvl >= remain) { qty += remain / p; cost += remain; remain = 0; }
      else { qty += s; cost += lvl; remain -= lvl; }
    }
  }
  return {
    vwap: cost / qty,                 // 평균 체결가
    short: remain,                    // 호가가 모자라 못 채운 금액 (0이면 전량 체결 가능)
    used,                             // 소진한 호가 단수
    bestKrw: levels[0][0] * levels[0][1], // 1호가 잔량 (KRW)
    next: levels[1] ? levels[1][0] : null, // 다음 호가
    depthKrw: depth,                  // 받은 호가 전체 깊이 (KRW)
  };
}

// 최대 실행 가능 아비트리지: 업비트 호가를 유리한 순서로 훑으며, 수수료(양쪽 절반씩) 차감 후에도 단위당 이익이 남는
// 호가까지 전부 먹는다고 가정. 빗썸 쪽은 지정가(메이커)라 같은 수량이 체결된다고 봄.
// levels: 업비트 [[price, size], ...] 유리한 순서 · makerPx: 빗썸 지정가 · sell: true면 업비트에서 매도(A), false면 매수(B)
function maxArb(levels, makerPx, sell) {
  const f = feeBp / 2 / 10000; // 한쪽 수수료 비율
  let notional = 0, profit = 0, used = 0;
  for (const [p, q] of levels) {
    const perUnit = sell ? p * (1 - f) - makerPx * (1 + f) : makerPx * (1 - f) - p * (1 + f);
    if (perUnit <= 0) break;
    notional += p * q; // 업비트 쪽 체결 금액
    profit += perUnit * q;
    used++;
  }
  return { notional, profit, used, exhausted: used > 0 && used === levels.length };
}

// 방향 A: 빗썸 best bid에 매수 지정가(메이커) → 업비트 bid 쪽으로 시장가 매도(테이커)
function dirA(u, b) {
  const sim = simulateTake(u.bids, takeSizeKrw);
  return {
    max: maxArb(u.bids, b.bid, true),
    label: '빗썸 매수(메이커) → 업비트 매도(테이커)', verb: '매도',
    maker: b.bid, taker: u.bid,
    gross: (u.bid / b.bid - 1) * 100,
    sim,
    slip: sim ? Math.max(0, (u.bid - sim.vwap) / u.bid * 100) : null,
    net: sim ? (sim.vwap / b.bid - 1) * 100 : null,
  };
}
// 방향 B: 빗썸 best ask에 매도 지정가(메이커) → 업비트 ask 쪽으로 시장가 매수(테이커)
function dirB(u, b) {
  const sim = simulateTake(u.asks, takeSizeKrw);
  return {
    max: maxArb(u.asks, b.ask, false),
    label: '빗썸 매도(메이커) → 업비트 매수(테이커)', verb: '매수',
    maker: b.ask, taker: u.ask,
    gross: (b.ask / u.ask - 1) * 100,
    sim,
    slip: sim ? Math.max(0, (sim.vwap - u.ask) / u.ask * 100) : null,
    net: sim ? (b.ask / sim.vwap - 1) * 100 : null,
  };
}

// 방향별 신호등 (가격 + 유동성):
//   bad(빨강)  — 슬리피지 반영 실효 갭이 0 이하이거나, 체결 규모만큼 호가가 없음
//   warn(노랑) — 실효 갭은 플러스지만 수수료 합 미만이거나, 다음 호가(2호가)를 넘어 3호가 이상 먹어야 함
//   good(초록) — 다음 호가까지로 전량 체결되고, 슬리피지 차감 실효 갭이 양쪽 수수료 합 이상 (= 수수료 내고도 수익)
function signal(d) {
  const s = d.sim;
  if (!s || s.short > 0 || d.net <= 0) return 'bad';
  if (d.net < feePct() || s.used > MAX_LEVELS_GOOD) return 'warn';
  return 'good';
}

function tooltip(d) {
  const s = d.sim;
  const lines = [
    d.label,
    '빗썸 ' + fmtPrice(d.maker) + ' (메이커) vs 업비트 ' + fmtPrice(d.taker) + ' (테이커) → 갭 ' + fmtPct(d.gross),
  ];
  if (s) {
    lines.push('업비트 1호가 잔량 ' + fmtKrwShort(s.bestKrw) + '원' + (s.next != null ? ' · 다음 호가 ' + fmtPrice(s.next) : ''));
    lines.push(fmtKrwShort(takeSizeKrw) + '원 ' + d.verb + ' 시 VWAP ' + fmtPrice(s.vwap, 2) +
      ' · 슬리피지 ' + d.slip.toFixed(3) + '% · ' + s.used + '호가 소진' +
      (s.short > 0 ? ' · 부족 ' + fmtKrwShort(s.short) + '원 (호가 합 ' + fmtKrwShort(s.depthKrw) + '원)' : ''));
    lines.push('슬리피지 반영 실효 갭 ' + fmtPct(d.net) + ' · 수수료 ' + feeBp + 'bp 차감 후 ' + fmtPct(d.net - feePct()));
  }
  const m = d.max;
  lines.push(m.used
    ? '최대 ' + fmtKrwShort(m.notional) + '원' + (m.exhausted ? '+(받은 호가 전부)' : '') + ' 실행 시 예상 수익 ' +
      fmtKrwShort(m.profit) + '원 (' + m.used + '호가, 수수료 차감)'
    : '수수료 차감 후 이익 나는 호가 없음');
  return lines.join('\n');
}

// ---------- 테이블 렌더링 ----------
function buildTable() {
  const tbody = $('rows');
  tbody.innerHTML = '';
  for (const sym of symbols) {
    const tr = document.createElement('tr');
    tr.id = 'row-' + sym;
    const cell = (id) => '<td id="' + sym + '-' + id + '" class="none">−</td>';
    tr.innerHTML = '<td>' + sym + '</td>' +
      cell('bithumb-bid') + cell('bithumb-ask') + cell('upbit-bid') + cell('upbit-ask') +
      cell('a-gap') + cell('a-slip') + cell('a-depth') + cell('a-max') + cell('a-profit') +
      cell('b-gap') + cell('b-slip') + cell('b-depth') + cell('b-max') + cell('b-profit');
    tbody.appendChild(tr);
  }
  for (const k of Object.keys(shown)) delete shown[k];
  // 이미 알고 있는 호가는 즉시 다시 그림 (토큰 목록 변경 시)
  for (const sym of symbols) renderRow(sym);
  paintStalePrices(); // 아직 비어 있는 칸은 직전 방문 호가로 (흐리게)
}

function updateCell(id, text, cls, flashDir) {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = cls;
  if (flashDir) {
    el.classList.remove('flash-up', 'flash-down');
    void el.offsetWidth; // 애니메이션 재시작
    el.classList.add(flashDir > 0 ? 'flash-up' : 'flash-down');
  }
}

function renderPrice(id, v) {
  const prev = shown[id];
  if (prev === v) return;
  shown[id] = v;
  updateCell(id, fmtPrice(v), '', prev == null ? 0 : Math.sign(v - prev));
}

// 내용이 실제로 바뀐 셀만 DOM을 건드림 (호가 스트림마다 전부 다시 그리지 않도록)
function setCell(id, html, cls, title) {
  const el = $(id);
  if (!el) return;
  const key = html + '|' + cls;
  if (shown[id] !== key) { shown[id] = key; el.innerHTML = html; el.className = cls; }
  el.title = title;
}

// 방향별 5칸: 갭(신호등 점 포함) / 슬립 / 업비트 1호가 잔량 / 최대 실행 규모 / 그때 예상 수익.
// 초록 방향은 연한 초록 띠, 수수료 차감 후 이익 나는 호가가 하나도 없는 방향은 보조 칸을 흐리게.
function renderDir(sym, key, d) {
  const s = d.sim, m = d.max, tip = tooltip(d), sig = signal(d);
  const band = sig === 'good' ? ' sig-good' : (m.used === 0 ? ' dim' : '');
  const sub = 'sub' + band;
  setCell(sym + '-' + key + '-gap', '<span class="hdot ' + sig + '"></span>' + fmtPct(d.gross), 'gap ' + pctCls(d.gross) + band, tip);
  setCell(sym + '-' + key + '-slip', !s ? '−' : (s.short > 0 ? '부족' : d.slip.toFixed(3) + '%'), sub + (s && s.short > 0 ? ' bad-text' : ''), tip);
  setCell(sym + '-' + key + '-depth', s ? fmtKrwShort(s.bestKrw) : '−', sub, tip);
  setCell(sym + '-' + key + '-max', m.used ? fmtKrwShort(m.notional) + (m.exhausted ? '+' : '') : '−', sub, tip);
  setCell(sym + '-' + key + '-profit', m.used ? '+' + fmtKrwShort(m.profit) : '−', sub + (m.used ? ' profit' : ''), tip);
}

function renderRow(sym) {
  const bk = books[sym];
  if (!bk) return;
  for (const ex of Object.keys(EXCHANGES)) {
    const b = bk[ex];
    if (!b) continue;
    renderPrice(sym + '-' + ex + '-bid', b.bid);
    renderPrice(sym + '-' + ex + '-ask', b.ask);
  }
  if (!bk.upbit || !bk.bithumb) return;
  renderDir(sym, 'a', dirA(bk.upbit, bk.bithumb));
  renderDir(sym, 'b', dirB(bk.upbit, bk.bithumb));
}

// 호가 스트림은 초당 수십 건이라 프레임 단위로 모아서 그림
const dirty = new Set();
let rafId = 0;
function markDirty(sym) {
  dirty.add(sym);
  if (!rafId) rafId = requestAnimationFrame(flush);
}
function flush() {
  rafId = 0;
  for (const s of dirty) renderRow(s);
  dirty.clear();
  if (anyLive) $('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleTimeString('ko-KR');
}

let lastSave = 0;
let anyLive = false;
function onBook(ex, sym, book) {
  if (!books[sym] || !book) return; // 목록에서 빠진 토큰의 늦은 메시지 무시
  anyLive = true;
  books[sym][ex] = book;
  markDirty(sym);
  // 다음 방문 때 연결 전에 보여줄 마지막 호가 저장 (5초 스로틀, best bid/ask만)
  const now = Date.now();
  if (now - lastSave > 5000) {
    lastSave = now;
    const slim = {};
    for (const s of symbols) {
      const bk = books[s];
      if (!bk) continue;
      slim[s] = {};
      for (const e of Object.keys(EXCHANGES)) if (bk[e]) slim[s][e] = { bid: bk[e].bid, ask: bk[e].ask };
    }
    try { localStorage.setItem('lastBooks', JSON.stringify({ t: now, books: slim })); } catch {}
  }
}

// 직전 방문에서 저장한 호가를 연결되기 전까지 흐리게 표시 (1시간 이내 저장본만)
function paintStalePrices() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem('lastBooks') || 'null'); } catch { return; }
  if (!saved || Date.now() - saved.t > 3600000) return;
  let painted = false;
  for (const sym of symbols) {
    const p = saved.books[sym];
    if (!p) continue;
    for (const ex of Object.keys(EXCHANGES)) {
      if (!p[ex]) continue;
      for (const side of ['bid', 'ask']) {
        const el = $(sym + '-' + ex + '-' + side);
        if (p[ex][side] != null && el && el.textContent === '−') {
          el.textContent = fmtPrice(p[ex][side]);
          el.className = 'stale';
          painted = true;
        }
      }
    }
  }
  if (painted && !anyLive) {
    $('updated').textContent = '이전 호가 표시 중 (' +
      new Date(saved.t).toLocaleTimeString('ko-KR') + ' 저장) — 연결되면 갱신됩니다';
  }
}

// ---------- 거래소별 상장 마켓 필터 ----------
// localStorage 캐시(1일)로 재방문 시 첫 페인트를 앞당김. 갱신은 백그라운드로.
async function validMarkets(ex, wanted) {
  const KEY = 'markets:' + ex;
  if (!marketCache[ex]) {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Date.now() - saved.t < 86400000) marketCache[ex] = new Set(saved.m);
    } catch {}
    const refresh = () => fetch(EXCHANGES[ex].rest + '/market/all', { cache: 'no-store' })
      .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then((all) => {
        marketCache[ex] = new Set(all.map((m) => m.market));
        try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), m: [...marketCache[ex]] })); } catch {}
      })
      .catch((e) => console.warn(ex + ' market/all 실패:', e));
    if (marketCache[ex]) setTimeout(refresh, 30000); // 캐시가 있으면 시작 버스트를 피해 나중에 갱신
    else await refresh();
  }
  if (!marketCache[ex]) return wanted; // 캐시도 네트워크도 실패 → 그대로 시도
  return wanted.filter((c) => marketCache[ex].has(c));
}

// ---------- 연결 관리 ----------
function stopExchange(ex) {
  const c = conns[ex];
  if (!c) return;
  c.stopped = true;
  c.polling = false;
  clearTimeout(c.failTimer);
  clearTimeout(c.reconnectTimer);
  clearInterval(c.pingTimer);
  clearTimeout(c.pollTimer);
  clearTimeout(c.wsRetryTimer);
  if (c.ws) { try { c.ws.close(); } catch {} }
  conns[ex] = null;
}

function startExchange(ex, codes) {
  stopExchange(ex);
  if (codes.length === 0) { setStatus(ex, 'err', capitalize(ex) + ' (상장 코인 없음)'); return; }
  const conn = { codes, ws: null, stopped: false, polling: false, wsFails: 0, wsRetryDelay: 1500, wsArmed: false,
                 failTimer: null, reconnectTimer: null, pingTimer: null, pollTimer: null, wsRetryTimer: null };
  conns[ex] = conn;
  // REST 폴링으로 시작해 호가를 즉시 표시하고, WS는 뒤에서 연결되면 실시간으로 업그레이드.
  // (업비트는 WS 연결 시도 rate limit이 엄격해서 첫 연결이 거부될 수 있음 — 그동안도 호가는 보여야 함)
  startPolling(ex, conn);
}

// ---------- WebSocket (Upbit 포맷 — Bithumb 2.0 API 동일 포맷) ----------
function connectWS(ex, conn) {
  let gotData = false;
  const ws = new WebSocket(EXCHANGES[ex].ws);
  conn.ws = ws;
  ws.binaryType = 'arraybuffer';

  // 8초 내 데이터가 없으면 포기 (폴링 중이면 다음 재시도 예약, 아니면 폴링 전환)
  conn.failTimer = setTimeout(() => {
    if (!gotData && !conn.stopped) {
      try { ws.onclose = null; ws.close(); } catch {}
      if (conn.polling) scheduleWsRetry(ex, conn);
      else { conn.wsRetryDelay = 10000; startPolling(ex, conn); }
    }
  }, 8000);

  ws.onopen = () => {
    if (conn.stopped) return;
    if (!conn.polling) setStatus(ex, 'wait', capitalize(ex) + ' 구독 중…');
    ws.send(JSON.stringify([
      { ticket: 'price-diff-viewer' },
      { type: 'orderbook', codes: conn.codes },
      { format: 'DEFAULT' },
    ]));
  };

  ws.onmessage = (ev) => {
    if (conn.stopped) return;
    let data;
    try {
      data = JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data));
    } catch { return; }
    if (data.error) { console.warn(ex + ' WS error:', data.error); return; }
    if (data.type !== 'orderbook' || !data.code || !Array.isArray(data.orderbook_units)) return;
    if (!gotData) {
      gotData = true;
      conn.wsFails = 0;
      conn.wsRetryDelay = 1500;
      if (conn.polling) { // WS 연결 성공 → 폴링 중단하고 실시간 전환
        conn.polling = false;
        clearTimeout(conn.pollTimer);
        clearTimeout(conn.wsRetryTimer);
      }
      setStatus(ex, 'ok', capitalize(ex) + ' 실시간');
    }
    onBook(ex, data.code.replace('KRW-', ''), parseBook(data.orderbook_units));
  };

  ws.onclose = () => {
    clearTimeout(conn.failTimer);
    if (conn.stopped) return;
    if (conn.polling) { scheduleWsRetry(ex, conn); return; } // 폴링 유지, WS는 점점 길게 재시도
    if (!gotData) {
      conn.wsFails++;
      if (conn.wsFails >= 3) { conn.wsRetryDelay = 10000; startPolling(ex, conn); return; } // 연속 실패 → REST 폴링 전환
    } else {
      conn.wsFails = 0;
    }
    setStatus(ex, 'err', capitalize(ex) + ' 재연결 중…');
    const delay = Math.min(3000 * Math.pow(2, conn.wsFails), 15000); // 지수 백오프
    conn.reconnectTimer = setTimeout(() => { if (!conn.stopped) connectWS(ex, conn); }, delay);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };

  // idle 연결 종료 방지
  clearInterval(conn.pingTimer);
  conn.pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('PING'); }, 50000);
}

// ---------- REST 폴링 (시작 모드이자 WS 실패 시 폴백) ----------
function startPolling(ex, conn) {
  if (conn.polling || conn.stopped) return;
  conn.polling = true;
  conn.wsArmed = false;
  setStatus(ex, 'wait', capitalize(ex) + ' 연결 중…');
  let errs = 0;
  const tick = async () => {
    if (conn.stopped || !conn.polling) return;
    try {
      const res = await fetch(EXCHANGES[ex].rest + '/orderbook?markets=' + conn.codes.join(','), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const list = await res.json();
      errs = 0;
      setStatus(ex, 'ok', capitalize(ex) + ' 폴링(' + (EXCHANGES[ex].pollMs / 1000) + 's)');
      for (const t of list) if (t.market) onBook(ex, t.market.replace('KRW-', ''), parseBook(t.orderbook_units || []));
      // REST가 통한다 = rate limit이 풀려 있다 → 그때부터 WS 업그레이드 시도
      if (!conn.wsArmed) { conn.wsArmed = true; scheduleWsRetry(ex, conn); }
    } catch (e) {
      if (await shouldBypassProxy(ex, conn)) return tick(); // 구버전 프록시 → 직접 호출로 즉시 재시도
      errs++;
      setStatus(ex, 'err', capitalize(ex) + ' 연결 실패 (재시도 중)');
      console.warn(ex + ' polling 실패:', e);
    }
    if (conn.stopped || !conn.polling) return;
    // 실패가 이어지면 지수 백오프 (최대 60초) — 요청을 멈춰야 rate limit 패널티가 풀림
    const base = EXCHANGES[ex].pollMs;
    conn.pollTimer = setTimeout(tick, Math.min(base * Math.pow(2, errs), 60000));
  };
  tick();
}

// 구버전 프록시 워커는 /v1/orderbook을 허용하지 않아 CORS 헤더 없는 404를 돌려주고, 브라우저에선 fetch 자체가 실패한다.
// 프록시의 market/all은 살아 있는데 orderbook만 실패하면 워커가 구버전인 것 → 직접 호출로 전환 (연결당 한 번만 검사).
// 프록시/네트워크 자체가 죽은 경우엔 프록시를 유지하고 평소처럼 백오프한다.
async function shouldBypassProxy(ex, conn) {
  if (ex !== 'upbit' || EXCHANGES.upbit.rest === UPBIT_DIRECT_REST || conn.proxyChecked) return false;
  conn.proxyChecked = true;
  const alive = await fetch(EXCHANGES.upbit.rest + '/market/all', { cache: 'no-store' }).then((r) => r.ok).catch(() => false);
  if (!alive || conn.stopped || !conn.polling) return false;
  console.warn('업비트 프록시가 /v1/orderbook을 지원하지 않음 — worker/upbit-proxy.js를 재배포하세요. 그동안 직접 호출로 전환합니다.');
  EXCHANGES.upbit.rest = UPBIT_DIRECT_REST;
  return true;
}

// 폴링 중 WS 연결을 점점 긴 간격으로 재시도 (1.5s → 3s → … → 최대 60s).
// 성공해 데이터가 오면 onmessage에서 폴링을 중단하고 실시간으로 전환.
// 업비트는 WS 연결 시도가 잦으면 429로 거부하므로 간격을 벌리는 것이 오히려 빨리 붙는 길.
function scheduleWsRetry(ex, conn) {
  clearTimeout(conn.wsRetryTimer);
  conn.wsRetryTimer = setTimeout(() => {
    if (conn.stopped || !conn.polling) return;
    connectWS(ex, conn);
  }, conn.wsRetryDelay);
  conn.wsRetryDelay = Math.min(conn.wsRetryDelay * 2, 60000);
}

function capitalize(s) { return s[0].toUpperCase() + s.slice(1); }

// ---------- 토큰 목록 적용 + 변경 감시 ----------
let applying = false;
async function applyTokens(next) {
  if (applying) return;
  applying = true;
  try {
    symbols = next;
    for (const k of Object.keys(books)) if (!next.includes(k)) delete books[k];
    for (const s of next) if (!books[s]) books[s] = { upbit: null, bithumb: null };
    buildTable();
    await Promise.all(Object.keys(EXCHANGES).map(async (ex) => {
      const codes = await validMarkets(ex, next.map((s) => 'KRW-' + s));
      startExchange(ex, codes);
    }));
  } finally {
    applying = false;
  }
}

function watchTokens() {
  setInterval(async () => {
    if (applying) return;
    let next;
    try { next = await loadTokens(); } catch { return; } // 일시적 로드 실패는 무시
    if (next.length === 0) return;
    if (JSON.stringify(next) !== JSON.stringify(symbols)) {
      hideError();
      await applyTokens(next);
    }
  }, TOKENS_POLL_MS);
}

// 새 버전이 배포되면 캐시를 우회해 자동 리로드 (구버전 캐시에 갇히지 않도록)
function watchVersion() {
  setInterval(async () => {
    try {
      const res = await fetch('./version.txt', { cache: 'no-store' });
      if (!res.ok) return;
      const v = (await res.text()).trim();
      if (v && v !== APP_VERSION) location.replace(location.pathname + '?u=' + v);
    } catch {}
  }, 30000);
}

// 선택 설정: proxy.txt에 Cloudflare Worker URL이 있으면 업비트 REST를 프록시로 우회
// (업비트가 github.io 같은 서드파티 Origin의 브라우저 요청을 차별적으로 제한하는 문제 대응)
async function loadProxyConfig() {
  try {
    const res = await fetch('./proxy.txt', { cache: 'no-store' });
    if (!res.ok) return;
    const line = (await res.text()).split('\n').map((s) => s.trim()).find((s) => s.startsWith('https://'));
    if (line) EXCHANGES.upbit.rest = line.replace(/\/+$/, '') + '/v1';
  } catch {}
}

// ---------- 시작 ----------
(async function main() {
  initTakeSize();
  await loadProxyConfig();
  let first;
  try {
    first = await loadTokens();
  } catch (e) {
    showError(e.message + ' — index.html과 같은 위치에 tokens.md가 있어야 합니다. (file:// 로 열면 안 되고 웹서버로 서빙해야 합니다)');
    watchTokens(); // 파일이 나중에 생기면 자동 복구
    return;
  }
  if (first.length === 0) {
    showError('tokens.md에서 토큰을 찾지 못했습니다.');
  } else {
    await applyTokens(first);
  }
  const verEl = $('app-ver');
  if (verEl) verEl.textContent = 'v' + APP_VERSION;
  watchTokens();
  watchVersion();
})();
</script>
